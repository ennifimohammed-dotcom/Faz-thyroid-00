name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Le dossier android/ est genere automatiquement par Flutter (Gradle,
      # Kotlin et manifeste toujours compatibles avec la version de Flutter).
      - name: Generer le projet Android
        run: |
          if [ ! -d android ]; then
            mkdir -p /tmp/keep
            cp -r lib test pubspec.yaml analysis_options.yaml /tmp/keep/
            flutter create --platforms=android --org com.fatmazahra --project-name fatma_zahra_thyroid_tracker .
            rm -rf lib test pubspec.yaml analysis_options.yaml
            cp -r /tmp/keep/lib /tmp/keep/test /tmp/keep/pubspec.yaml /tmp/keep/analysis_options.yaml .
          fi
          sed -i 's/android:label="[^"]*"/android:label="Suivi Thyroide"/' android/app/src/main/AndroidManifest.xml

      - name: Dependances
        run: flutter pub get

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: APK release
        run: flutter build apk --release

      - name: Publier l'APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publier l'APK dans la Release (tag vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
